      "Source": "Repository",
      "Date": "2022-08-20",
      "Title": "Tools for Polyploid Microsatellite Analysis",
      "Authors@R": "c(person(\"Lindsay V.\", \"Clark\", email = \"Lindsay.Clark@seattlechildrens.org\", role = c(\"aut\", \"cre\"), comment = c(ORCID = \"0000-0002-3881-9252\")), person(\"Alistair J.\", \"Hall\", role = \"ctb\", comment = c(ORCID = \"0000-0001-9293-8909\")), person(\"Handunnethi Nihal\", \"de Silva\", role = \"ctb\"), person(\"Tyler William\", \"Smith\", role = \"ctb\", comment = c(ORCID = \"0000-0001-7683-2653\")))",
